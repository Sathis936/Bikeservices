<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Rent o Ride - Scooter & Moped Rental</title>
  <meta name="description" content="Reset your Rent o Ride account password.">
  <meta name="keywords" content="scooter rental, moped hire, electric scooter, urban mobility, bike rental">
  <meta property="og:title" content="Forgot Password | Rent o Ride">
  <meta property="og:description" content="Reset your Rent o Ride account password.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/images/banners/urban-mobility.svg">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/vendor/swiper/swiper-bundle.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>



<main class="auth-section min-vh-100 d-flex align-items-center justify-content-center position-relative">
  <!-- Top Utility Bar -->
  <div class="position-absolute top-0 start-0 end-0 p-3 p-md-4 d-flex justify-content-between align-items-center">
    <a href="login.html" class="btn btn-sm btn-outline-secondary d-inline-flex align-items-center gap-1 shadow-sm">
      <i class="bi bi-arrow-left"></i> <span class="d-none d-sm-inline">Back to</span> Login
    </a>
    <div class="d-flex align-items-center gap-2">
      <button type="button" class="btn btn-sm btn-icon btn-outline-primary theme-toggle-btn" title="Toggle Theme" aria-label="Toggle Theme">
        <i class="bi bi-moon-stars-fill"></i>
      </button>
      <button type="button" class="btn btn-sm btn-icon btn-outline-primary rtl-toggle-btn fw-bold" title="Toggle LTR/RTL Layout" aria-label="Toggle Direction">RTL</button>
    </div>
  </div>

  <div class="container">
    <div class="auth-card-wrapper">
      <div class="card auth-card p-4 p-sm-4 shadow-lg text-center">
        <a href="index.html" class="d-inline-block mb-3">
          <img src="assets/images/logo.svg" alt="Rent o Ride Logo" class="brand-logo-img" height="40">
        </a>
        <h4 class="fw-bold mb-1">Password Recovery</h4>
        <p class="text-muted small mb-3">Enter your registered email address and we will send you a secure password reset link.</p>

        <form class="needs-validation text-start" novalidate data-success-msg="Password reset link sent! Check your inbox.">
          <div class="mb-3">
            <label class="form-label small fw-bold text-muted">Registered Email</label>
            <input type="email" class="form-control" required placeholder="name@example.com">
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2 mb-2"><i class="bi bi-envelope-check me-1"></i> Send Reset Link</button>
        </form>

        <div class="border-top pt-3 mt-3">
          <a href="login.html" class="small text-primary fw-bold">&larr; Back to Login</a>
        </div>
      </div>
    </div>
  </div>
</main>


  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="assets/vendor/swiper/swiper-bundle.min.js"></script>
  <script src="assets/vendor/chartjs/chart.umd.min.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/booking.js"></script>
  <script src="assets/js/dashboard.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>

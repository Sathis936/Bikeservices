<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Sign In | Rent o Ride - Scooter & Moped Rental</title>
  <meta name="description" content="Sign in to access your active bookings, rental receipts, and profile.">
  <meta name="keywords" content="scooter rental, moped hire, electric scooter, urban mobility, bike rental">
  <meta property="og:title" content="Customer Sign In | Rent o Ride">
  <meta property="og:description" content="Sign in to access your active bookings, rental receipts, and profile.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/images/banners/urban-mobility.svg">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/vendor/swiper/swiper-bundle.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>



<main class="auth-section min-vh-100 d-flex align-items-center justify-content-center position-relative py-5">
  <!-- Top Utility Bar -->
  <div class="position-absolute top-0 end-0 p-3 p-md-4 d-flex align-items-center gap-2 z-2">
    <button type="button" class="btn btn-sm btn-icon btn-outline-primary theme-toggle-btn" title="Toggle Theme" aria-label="Toggle Theme">
      <i class="bi bi-moon-stars-fill"></i>
    </button>
    <button type="button" class="btn btn-sm btn-icon btn-outline-primary rtl-toggle-btn fw-bold" title="Toggle LTR/RTL Layout" aria-label="Toggle Direction">RTL</button>
  </div>

  <div class="container">
    <div class="auth-card-wrapper">
      <div class="card auth-card p-4 p-sm-4 shadow-lg">
        <div class="text-center mb-3">
          <a href="index.html" class="d-inline-block mb-3">
            <img src="assets/images/logo.svg" alt="Rent o Ride Logo" class="brand-logo-img" height="40">
          </a>
          <h4 class="fw-bold mb-1">Welcome Back</h4>
          <p class="text-muted small mb-0">Sign in to manage your scooter rentals &amp; receipts</p>
        </div>

        <div id="loginStatusAlert" class="alert alert-success d-none align-items-center gap-2 py-2 mt-2 mb-3" role="alert">
          <i class="bi bi-check-circle-fill fs-5 text-success"></i>
          <div class="small">
            <div><strong>Dummy Sign-In Active:</strong> Signed in as <span id="loginStatusName">Alex Vance</span>.</div>
            <div class="text-muted">No redirect occurred. Session and navbar updated. You can click <a href="customer-dashboard.html" class="fw-bold text-success text-decoration-underline">Dashboard</a> or browse to <a href="index.html" class="fw-bold text-success text-decoration-underline">Home</a>.</div>
          </div>
        </div>

        <form class="needs-validation" novalidate data-success-msg="Signed in successfully! (Dummy Mode - No redirect)">
          <div class="mb-3">
            <label class="form-label small fw-bold text-muted">Email Address</label>
            <input type="email" class="form-control" value="alex.vance@example.com" required>
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="form-label small fw-bold text-muted mb-0">Password</label>
              <a href="forgot-password.html" class="small text-primary">Forgot Password?</a>
            </div>
            <div class="input-group">
              <input type="password" class="form-control" value="Secret123!" required>
              <button type="button" class="btn btn-outline-secondary password-toggle-btn"><i class="bi bi-eye"></i></button>
            </div>
          </div>

          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="rememberMe" checked>
            <label class="form-check-label small text-muted" for="rememberMe">Remember my device</label>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 mb-2"><i class="bi bi-box-arrow-in-right me-1"></i> Sign In</button>
          
          <button type="button" class="btn btn-outline-success w-100 py-2 mb-2 fw-semibold" onclick="window.RentORideAuth.login({ name: 'Alex Vance', email: 'alex.vance@example.com' }, null); const al = document.getElementById('loginStatusAlert'); if (al) { const nm = document.getElementById('loginStatusName'); if (nm) nm.textContent = 'Alex Vance'; al.classList.remove('d-none'); al.classList.add('d-flex'); }">
            <i class="bi bi-lightning-charge-fill me-1"></i> 1-Click Demo Sign In (Alex Vance)
          </button>
        </form>

        <div class="text-center border-top pt-3 mt-2">
          <span class="text-muted small">Don't have an account? <a href="register.html" class="fw-bold text-primary">Register Free</a></span>
        </div>
      </div>
    </div>
  </div>
</main>


  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="assets/vendor/swiper/swiper-bundle.min.js"></script>
  <script src="assets/vendor/chartjs/chart.umd.min.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/booking.js"></script>
  <script src="assets/js/dashboard.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if (window.RentORideAuth && window.RentORideAuth.isLoggedIn()) {
        const user = window.RentORideAuth.getUser();
        const al = document.getElementById('loginStatusAlert');
        const nm = document.getElementById('loginStatusName');
        if (al) {
          if (nm && user) nm.textContent = user.name;
          al.classList.remove('d-none');
          al.classList.add('d-flex');
        }
      }
    });
  </script>
</body>
</html>

  <meta charset="UTF-8">

  <meta name="description" content="Rent o Ride is expanding to 12 new coastal stations soon.">

  <meta property="og:title" content="Launching Soon in New Cities | Rent o Ride">

  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/images/banners/urban-mobility.svg">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/vendor/bootstrap-icons/bootstrap-icons.min.css">

  <link rel="stylesheet" href="assets/css/style.css">

<body>

<div class="min-vh-100 d-flex align-items-center justify-content-center bg-dark text-white p-4" style="background: linear-gradient(135deg, #071A2F 0%, #0D2644 100%);">
  <div class="container max-w-700 text-center">
    <a href="index.html"><img src="assets/images/logo-white.svg" alt="Rent o Ride" height="42" class="mb-4"></a>
    <span class="badge bg-secondary text-white px-3 py-2 rounded-pill fw-bold mb-3">Expansion Launch</span>
    <h1 class="display-5 fw-bold mb-3">We Are Launching Soon!</h1>
    <p class="text-white-50 fs-5 mb-5">Our next-generation smart electric scooter stations are coming to your city in:</p>

    <!-- Countdown Timer Grid -->
    <div class="row g-3 justify-content-center mb-5" id="launchCountdown">
      <div class="col-3 col-md-2">
        <div class="p-3 bg-white bg-opacity-10 border border-white border-opacity-10 rounded-4">
          <div class="display-6 fw-bold font-heading text-secondary" id="countDays">28</div>
          <small class="text-white-50">Days</small>
        </div>
      </div>
      <div class="col-3 col-md-2">
        <div class="p-3 bg-white bg-opacity-10 border border-white border-opacity-10 rounded-4">
          <div class="display-6 fw-bold font-heading text-secondary" id="countHours">14</div>
          <small class="text-white-50">Hours</small>
        </div>
      </div>
      <div class="col-3 col-md-2">
        <div class="p-3 bg-white bg-opacity-10 border border-white border-opacity-10 rounded-4">
          <div class="display-6 fw-bold font-heading text-secondary" id="countMins">45</div>
          <small class="text-white-50">Minutes</small>
        </div>
      </div>
      <div class="col-3 col-md-2">
        <div class="p-3 bg-white bg-opacity-10 border border-white border-opacity-10 rounded-4">
          <div class="display-6 fw-bold font-heading text-secondary" id="countSecs">30</div>
          <small class="text-white-50">Seconds</small>
        </div>
      </div>
    </div>

    <!-- Notify Form -->
    <form class="needs-validation max-w-500 mx-auto" novalidate data-success-msg="You are on the VIP early access list!">
      <div class="input-group input-group-lg">
        <input type="email" class="form-control" placeholder="Enter your email" required>
        <button class="btn btn-secondary-accent" type="submit">Get Early Invite</button>
      </div>
    </form>

    <div class="mt-4">
      <a href="index.html" class="text-white-50 small">&larr; Back to Main Website</a>
    </div>
  </div>
</div>

  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="assets/vendor/swiper/swiper-bundle.min.js"></script>
  <script src="assets/vendor/chartjs/chart.umd.min.js"></script>

  <script src="assets/js/validation.js"></script>
  <script src="assets/js/booking.js"></script>
  <script src="assets/js/dashboard.js"></script>
  <script src="assets/js/main.js"></script>
</body>

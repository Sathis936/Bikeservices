<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Rent o Ride - Scooter & Moped Rental</title>
  <meta name="description" content="Register for Rent o Ride for fast, paperless scooter check-ins.">
  <meta name="keywords" content="scooter rental, moped hire, electric scooter, urban mobility, bike rental">
  <meta property="og:title" content="Create Account | Rent o Ride">
  <meta property="og:description" content="Register for Rent o Ride for fast, paperless scooter check-ins.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/images/banners/urban-mobility.svg">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/vendor/swiper/swiper-bundle.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>



<main class="auth-section min-vh-100 d-flex align-items-center justify-content-center position-relative py-5">
  <!-- Top Utility Bar -->
  <div class="position-absolute top-0 end-0 p-3 p-md-4 d-flex align-items-center gap-2 z-2">
    <button type="button" class="btn btn-sm btn-icon btn-outline-primary theme-toggle-btn" title="Toggle Theme" aria-label="Toggle Theme">
      <i class="bi bi-moon-stars-fill"></i>
    </button>
    <button type="button" class="btn btn-sm btn-icon btn-outline-primary rtl-toggle-btn fw-bold" title="Toggle LTR/RTL Layout" aria-label="Toggle Direction">RTL</button>
  </div>

  <div class="container">
    <div class="auth-card-wrapper auth-register-wrapper">
      <div class="card auth-card p-4 p-sm-4 shadow-lg">
        <div class="text-center mb-3">
          <a href="index.html" class="d-inline-block mb-3">
            <img src="assets/images/logo.svg" alt="Rent o Ride Logo" class="brand-logo-img" height="40">
          </a>
          <h4 class="fw-bold mb-1">Create Rider Account</h4>
          <p class="text-muted small mb-0">Instant online license verification &amp; paperless booking</p>
        </div>

        <form class="needs-validation" novalidate data-success-msg="Account registered successfully! Redirecting to dashboard..." data-redirect="customer-dashboard.html">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label small fw-bold text-muted">First Name</label>
              <input type="text" class="form-control" required placeholder="Alex">
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-bold text-muted">Last Name</label>
              <input type="text" class="form-control" required placeholder="Vance">
            </div>
            <div class="col-12">
              <label class="form-label small fw-bold text-muted">Email Address</label>
              <input type="email" class="form-control" required placeholder="alex@example.com">
            </div>
            <div class="col-12">
              <label class="form-label small fw-bold text-muted">Mobile Phone</label>
              <input type="tel" class="form-control" required placeholder="+1 (555) 019-2834">
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-bold text-muted">Password</label>
              <input type="password" class="form-control" required placeholder="••••••••">
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-bold text-muted">Confirm Password</label>
              <input type="password" class="form-control" required placeholder="••••••••">
            </div>
            <div class="col-12">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="termsAgree" required>
                <label class="form-check-label small text-muted" for="termsAgree">
                  I agree to the <a href="safety-deposit.html" target="_blank">Terms of Service</a> &amp; <a href="safety-deposit.html" target="_blank">Deposit Policy</a>
                </label>
              </div>
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-primary w-100 py-2"><i class="bi bi-person-plus-fill me-1"></i> Register Account</button>
            </div>
          </div>
        </form>

        <div class="text-center border-top pt-3 mt-3">
          <span class="text-muted small">Already have an account? <a href="login.html" class="fw-bold text-primary">Sign In</a></span>
        </div>
      </div>
    </div>
  </div>
</main>


  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="assets/vendor/swiper/swiper-bundle.min.js"></script>
  <script src="assets/vendor/chartjs/chart.umd.min.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/booking.js"></script>
  <script src="assets/js/dashboard.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
